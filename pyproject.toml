[project]
name = "sdmgeo"
version = "0.1.0"
description = "Geometric detection of contamination in SDM features (intrinsic dimension)"
requires-python = ">=3.10"
dependencies = ["numpy<2", "scipy", "scikit-learn", "matplotlib"]

[project.optional-dependencies]
geometry = ["dadapy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdmgeo"]
