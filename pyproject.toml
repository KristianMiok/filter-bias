[project]
name = "filter_bias"
version = "0.1.0"
description = "Geometric detection of contamination in SDM features (intrinsic dimension)"
requires-python = ">=3.10"
dependencies = [
    "numpy<2",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "pandas>=2.3.3",
    "pygbif>=0.6.6",
    "rasterio>=1.4.4",
    "openpyxl>=3.1.5",
    "xgboost>=3.2.0",
]

[project.optional-dependencies]
geometry = ["dadapy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filter_bias"]
